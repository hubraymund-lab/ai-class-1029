<title>같은 AI로 다른 결과 만들기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위 고정 띠(제목·연결 상태·글자 크기) + 가운데 한 줄 본문(읽기 폭 40em) + 강사 모드 아래 조종 띠 */
:root {
  --paper: #f5f7f6;      /* 바닷가 흐린 날의 종이색, 청록 쪽으로 기운 흰색 */
  --ink: #18242b;        /* 본문 글씨 */
  --muted: #56656d;      /* 보조 글씨 */
  --line: #cfd8da;       /* 선 */
  --sea: #0e6a82;        /* 강조: 제주 바다 */
  --buoy: #e2620f;       /* '지금 여기': 테왁 주황 */
  --buoy-soft: #fdeadb;
  --panel: #ffffff;
  --code: #eef2f1;
  --c-gray: #eceff0; --c-blue: #e3eef4; --c-red: #f8e4e2; --c-orange: #fbeadb;
  --c-green: #e4f1e6; --c-yellow: #f8f0d4; --c-purple: #ece6f3;
  --f-display: "Gowun Batang", "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --fs: 19px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10181c; --ink: #e3eaec; --muted: #9aaab1; --line: #2c3a40; --sea: #5cb8d1;
  --buoy: #ff8a3d; --buoy-soft: #3a2418; --panel: #172227; --code: #1c292f;
  --c-gray: #1d272b; --c-blue: #16303b; --c-red: #3a2020; --c-orange: #3a2a1c;
  --c-green: #1b3122; --c-yellow: #353019; --c-purple: #2a2336; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #10181c; --ink: #e3eaec; --muted: #9aaab1; --line: #2c3a40; --sea: #5cb8d1;
  --buoy: #ff8a3d; --buoy-soft: #3a2418; --panel: #172227; --code: #1c292f;
  --c-gray: #1d272b; --c-blue: #16303b; --c-red: #3a2020; --c-orange: #3a2a1c;
  --c-green: #1b3122; --c-yellow: #353019; --c-purple: #2a2336; color-scheme: dark; }

html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 84px); }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: var(--fs); line-height: 1.75; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

/* 위 띠 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.bar-in { max-width: 62rem; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 15px; line-height: 1.3; }
.bar-title { font-family: var(--f-display); font-weight: 700; font-size: 17px; margin-right: auto; min-width: 0; }
.status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.status[data-s="on"] .dot { background: #2e9b55; }
.status[data-s="on"] { color: var(--ink); }
.btn { font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; line-height: 1.2; }
.btn:hover { border-color: var(--sea); }
.btn:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--panel); }
.group { display: inline-flex; gap: 4px; }

/* 본문 */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 140px; }
#lesson { max-width: 40em; margin: 0 auto; }
#lesson h1 { font-family: var(--f-display); font-size: 1.75em; line-height: 1.3; margin: 2.4em 0 .5em; padding-top: .6em; border-top: 2px solid var(--ink); text-wrap: balance; }
#lesson h1:first-child { margin-top: .4em; }
#lesson h2 { font-size: 1.28em; line-height: 1.4; margin: 1.9em 0 .4em; text-wrap: balance; }
#lesson h3 { font-size: 1.08em; margin: 1.4em 0 .3em; }
#lesson p { margin: .55em 0; }
#lesson ul, #lesson ol { padding-left: 1.4em; margin: .5em 0; }
#lesson li { margin: .25em 0; }
#lesson a { color: var(--sea); text-underline-offset: 3px; }
#lesson b, #lesson strong { font-weight: 700; }
#lesson blockquote { margin: 1em 0; padding: .2em 0 .2em 1em; border-left: 4px solid var(--sea); font-family: var(--f-display); font-size: 1.08em; }
#lesson hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.tbl { overflow-x: auto; margin: .8em 0; }
#lesson table { border-collapse: collapse; width: 100%; font-size: .9em; line-height: 1.55; }
#lesson th, #lesson td { border: 1px solid var(--line); padding: .45em .6em; text-align: left; vertical-align: top; word-break: keep-all; }
#lesson th { background: var(--c-gray); font-weight: 500; }
#lesson code { font-family: var(--f-body); background: var(--code); padding: .05em .3em; border-radius: 3px; font-size: .92em; }
.pre { position: relative; margin: .9em 0; }
#lesson pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 1em 1em 1em; padding-top: 2.6em; margin: 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-family: var(--f-body); font-size: .86em; line-height: 1.65; }
#lesson pre code { background: none; padding: 0; font-size: 1em; }
.copy { position: absolute; top: 8px; right: 8px; font-size: 14px; padding: 5px 12px; background: var(--panel); }
.copy.done { background: var(--sea); color: var(--panel); border-color: var(--sea); }
.callout { padding: .8em 1em; margin: 1em 0; border-radius: 6px; background: var(--c-gray); }
.callout > :first-child { margin-top: 0; } .callout > :last-child { margin-bottom: 0; }
.callout.blue { background: var(--c-blue); } .callout.red { background: var(--c-red); } .callout.orange { background: var(--c-orange); }
.callout.green { background: var(--c-green); } .callout.yellow { background: var(--c-yellow); } .callout.purple { background: var(--c-purple); }
details.toggle { margin: .9em 0; border: 1px solid var(--line); border-radius: 6px; padding: .5em .9em; background: var(--panel); }
details.toggle > summary { cursor: pointer; font-weight: 700; }
details.toggle[open] > summary { margin-bottom: .4em; }
.quote { background: var(--c-gray); padding: .8em 1em; border-radius: 6px; margin: .9em 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(14em, 1fr)); gap: 12px; margin: .9em 0; }
.col { border: 1px solid var(--line); border-radius: 6px; padding: .6em 1em; min-width: 0; }
.gray { color: var(--muted); font-size: .85em; }
.dl { display: inline-block; margin-top: .6em; background: var(--sea); color: var(--panel) !important; text-decoration: none; padding: .45em 1em; border-radius: 6px; font-weight: 700; }

/* 지금 여기 */
.mark { position: relative; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); }
.mark.here::before { content: "지금 여기"; position: absolute; top: -1.9em; left: 0; font-family: var(--f-body); font-size: 13px; font-weight: 700; letter-spacing: .04em;
  color: var(--panel); background: var(--buoy); padding: 2px 9px; border-radius: 3px; }
#lesson h1.mark.here::before { top: -.6em; }
.mark.here { box-shadow: -14px 0 0 -6px var(--buoy); }
.teachbtn { display: none; }
body.teach .teachbtn { display: inline-block; margin-left: .6em; vertical-align: middle; font-family: var(--f-body); font-size: 13px; padding: 3px 9px; }

/* 수강생: 강사 위치로 돌아가기 */
.back { position: fixed; z-index: 8; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: var(--buoy); color: #fff; border: 0; font-size: 16px; font-weight: 700; padding: 12px 18px; border-radius: 30px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.help { position: fixed; z-index: 8; left: max(16px, calc(env(safe-area-inset-left, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  font-size: 15px; padding: 10px 16px; border-radius: 30px; background: var(--panel); }
.help[aria-pressed="true"] { background: var(--buoy); border-color: var(--buoy); color: #fff; }
body.teach .help, body.teach .back { display: none; }

/* 목차 */
.toc { position: fixed; z-index: 11; inset: 0 0 0 auto; width: min(24rem, 92vw); background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 20px; font-size: 16px; line-height: 1.45; }
.toc h2 { font-family: var(--f-display); font-size: 20px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; color: var(--ink); text-decoration: none; padding: 6px 8px; border-radius: 4px; }
.toc a.l2 { padding-left: 22px; font-size: 15px; color: var(--muted); }
.toc a:hover { background: var(--c-gray); }
.toc a.here { background: var(--buoy-soft); color: var(--ink); font-weight: 700; }

/* 강사 조종 띠 */
.dock { display: none; position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--paper);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 10px); }
body.teach .dock { display: block; }
.dock-in { max-width: 62rem; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; line-height: 1.3; }
.dock .btn { background: transparent; color: var(--paper); border-color: #5a6a72; }
.dock .now { margin-right: auto; min-width: 0; }
.dock .now b { color: var(--buoy); }
.keyform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: 100%; }
.keyform input { flex: 1 1 16rem; min-width: 0; font: inherit; font-size: 15px; padding: 7px 10px; border-radius: 6px; border: 1px solid #5a6a72; background: #0f171b; color: #fff; }
#keyMsg { color: var(--buoy); font-weight: 700; }
.pill { border: 1px solid #5a6a72; border-radius: 20px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.pill.warn { background: var(--buoy); border-color: var(--buoy); color: #fff; font-weight: 700; }
.crowd { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.crowd b { color: var(--ink); }
.toc .cnt { float: right; margin-left: 8px; font-size: 13px; font-weight: 700; color: #fff; background: var(--sea); border-radius: 10px; padding: 0 7px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.show { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; background: rgba(12,20,24,.94); color: #fff; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.show .big { font-family: var(--f-display); font-size: clamp(64px, 16vw, 150px); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.show .lbl { font-size: clamp(18px, 3.4vw, 28px); margin-top: .4em; }
.show .row { display: flex; gap: clamp(28px, 7vw, 90px); justify-content: center; flex-wrap: wrap; }
.show .bar2 { width: min(560px, 80vw); height: 14px; border-radius: 7px; background: rgba(255,255,255,.22); margin: 1.4em auto .4em; overflow: hidden; }
.show .bar2 i { display: block; height: 100%; background: var(--buoy); width: 0; transition: width 1.2s ease-out; }
.show .sub { font-size: 18px; opacity: .85; }
.note { max-width: 40em; margin: 0 auto 18px; font-size: 15px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 10px 14px; line-height: 1.55; }
.cover { max-width: 40em; margin: 0 auto 8px; }
.cover .eyebrow { font-size: 15px; color: var(--muted); letter-spacing: .03em; }
.cover h1 { font-family: var(--f-display); font-size: 2.2em; line-height: 1.25; margin: .15em 0 .2em; text-wrap: balance; }
@media (max-width: 560px) {
  :root { --fs: 18px; }
  .bar-in { gap: 6px; } .bar-title { width: 100%; font-size: 15px; }
  .bar .btn { font-size: 14px; padding: 6px 9px; }
  #statusText { display: none; } .status { margin-right: auto; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

<header class="bar">
  <div class="bar-in">
    <span class="bar-title" id="ttl">같은 AI로 다른 결과 만들기</span>
    <span class="status" id="status" data-s="off"><span class="dot"></span><span id="statusText">연결 중…</span></span>
    <span class="crowd" id="crowd" hidden></span>
    <button class="btn" id="follow" type="button" aria-pressed="true">강사 따라가기</button>
    <span class="group" aria-label="글자 크기">
      <button class="btn" id="fsDown" type="button" aria-label="글자 작게">가−</button>
      <button class="btn" id="fsUp" type="button" aria-label="글자 크게">가+</button>
    </span>
    <button class="btn" id="tocBtn" type="button" aria-expanded="false" aria-controls="toc">목차</button>
  </div>
</header>

<main>
  <div class="cover"><div class="eyebrow">사회복지사 AI 심화과정 · 2026. 10. 29. 제주복지이음마루</div><h1>같은 AI로 다른 결과 만들기</h1></div>
  <p class="note" id="demoNote" hidden></p>
  <article id="lesson"><!--LESSON--></article>
</main>

<nav class="toc" id="toc" hidden aria-label="목차">
  <h2>목차 <button class="btn" id="tocClose" type="button">닫기</button></h2>
  <div id="tocList"></div>
</nav>

<button class="back btn" id="back" type="button" hidden>강사 위치로 ↓</button>
<button class="help btn" id="help" type="button" aria-pressed="false">✋ 막혔어요</button>

<div class="show" id="show" hidden role="dialog" aria-label="참여 현황">
  <div>
    <div class="row">
      <div><div class="big" id="showN">0</div><div class="lbl">명이 함께 보고 있어요</div></div>
      <div><div class="big" id="showF">0</div><div class="lbl">명이 강사를 따라오는 중</div></div>
    </div>
    <div class="bar2"><i id="showBar"></i></div>
    <div class="sub" id="showSub"></div>
  </div>
</div>

<div class="dock" id="dock">
  <div class="dock-in">
    <span class="now">강사 모드 · 지금 <b id="nowName">—</b></span>
    <span class="pill" id="countPill">접속 0명</span>
    <span class="pill" id="followPill">따라오는 중 0명</span>
    <span class="pill" id="helpPill">막혔어요 0명</span>
    <button class="btn" id="showBtn" type="button">📣 모두에게 보여주기</button>
    <form class="keyform" id="keyForm" hidden>
      <label for="keyIn">강사 열쇠</label>
      <input id="keyIn" type="password" autocomplete="off" placeholder="강사 링크나 #teach. 뒤 글자를 붙여 넣기">
      <button class="btn" type="submit">넣기</button>
      <span id="keyMsg"></span>
    </form>
    <button class="btn" id="prev" type="button">◀ 이전</button>
    <button class="btn" id="next" type="button">다음 ▶</button>
  </div>
</div>

<script type="application/json" id="cfg"><!--CONFIG--></script>
<!--SUPABASE-->
<script>
(() => {
  const CFG = JSON.parse(document.getElementById('cfg').textContent || '{}');
  const $ = (id) => document.getElementById(id);
  const lesson = $('lesson');
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

  /* ---------- 교안 다듬기 ---------- */
  lesson.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
  lesson.querySelectorAll('pre').forEach(pre => {
    const w = document.createElement('div'); w.className = 'pre'; pre.replaceWith(w); w.appendChild(pre);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn copy'; b.textContent = '복사';
    b.addEventListener('click', () => {
      const text = pre.innerText.replace(/\n$/, '');
      const ok = () => { b.textContent = '복사됨'; b.classList.add('done'); setTimeout(() => { b.textContent = '복사'; b.classList.remove('done'); }, 1600); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Ctrl+C로 복사'; };
      try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
    });
    w.appendChild(b);
  });
  lesson.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  if (CFG.downloadUrl) {
    const c = [...lesson.querySelectorAll('.callout')].find(el => el.textContent.includes('수강생 실습자료'));
    if (c) { const a = document.createElement('a'); a.className = 'dl'; a.href = CFG.downloadUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '실습자료 내려받기'; c.appendChild(a); }
  }

  /* 구역 표시: h1·h2마다 고정 id (글자에서 만든 값이라 교안을 고쳐도 같은 제목이면 같은 id) */
  const hash = (s) => { let h = 5381; for (const ch of s) h = ((h * 33) ^ ch.codePointAt(0)) >>> 0; return h.toString(36); };
  const seen = {};
  const marks = [...lesson.querySelectorAll('h1, h2')].map(h => {
    const label = h.textContent.trim(); let id = 's' + hash(label); seen[id] = (seen[id] || 0) + 1; if (seen[id] > 1) id += '-' + seen[id];
    h.id = id; h.classList.add('mark'); h.dataset.label = label;
    const tb = document.createElement('button'); tb.type = 'button'; tb.className = 'btn teachbtn'; tb.textContent = '여기로';
    tb.addEventListener('click', () => teachGo(id)); h.appendChild(tb);
    return h;
  });
  const byId = Object.fromEntries(marks.map(m => [m.id, m]));
  $('tocList').innerHTML = '';
  marks.forEach(m => { const a = document.createElement('a'); a.href = '#' + m.id; a.textContent = m.dataset.label; a.className = m.tagName === 'H1' ? 'l1' : 'l2'; a.dataset.id = m.id;
    a.addEventListener('click', (e) => { e.preventDefault(); closeToc(); if (teach) teachGo(m.id); else { setFollow(false); m.scrollIntoView({ behavior: 'smooth' }); } }); $('tocList').appendChild(a); });

  /* ---------- 글자 크기 · 목차 ---------- */
  let fs = parseInt(store.get('fs') || '0', 10) || 0;
  const applyFs = () => { if (fs) document.documentElement.style.setProperty('--fs', fs + 'px'); };
  applyFs();
  const cur = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 19;
  $('fsUp').onclick = () => { fs = Math.min(28, cur() + 2); applyFs(); store.set('fs', fs); };
  $('fsDown').onclick = () => { fs = Math.max(15, cur() - 2); applyFs(); store.set('fs', fs); };
  const closeToc = () => { $('toc').hidden = true; $('tocBtn').setAttribute('aria-expanded', 'false'); };
  $('tocBtn').onclick = () => { const o = $('toc').hidden; $('toc').hidden = !o; $('tocBtn').setAttribute('aria-expanded', String(o)); };
  $('tocClose').onclick = closeToc;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeToc(); });

  /* ---------- 상태 ---------- */
  const teach = location.hash.startsWith('#teach');
  const myId = Math.random().toString(36).slice(2, 10);
  let here = null, hereTs = 0, follow = true, helpOn = false, myAt = null;
  if (teach) document.body.classList.add('teach');

  function paintHere() {
    marks.forEach(m => m.classList.toggle('here', m.id === here));
    document.querySelectorAll('#tocList a').forEach(a => a.classList.toggle('here', a.dataset.id === here));
    if (teach) $('nowName').textContent = here && byId[here] ? byId[here].dataset.label : '—';
    updateBack();
  }
  function setFollow(on) { const ch = on !== follow; follow = on; $('follow').setAttribute('aria-pressed', String(on)); updateBack(); if (ch) { try { transports.forEach(t => t.presence()); refreshCounts(); } catch (e) {} } }
  $('follow').onclick = () => { setFollow(!follow); if (follow) jump(); };
  $('back').onclick = () => { setFollow(true); jump(); };
  function jump() { if (here && byId[here]) byId[here].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  function updateBack() {
    if (teach || !here || !byId[here]) { $('back').hidden = true; return; }
    const r = byId[here].getBoundingClientRect(); const far = r.top > innerHeight || r.bottom < 0;
    $('back').hidden = !far;
  }
  /* 수강생이 직접 크게 스크롤하면 따라가기를 잠시 끔 */
  let autoScrolling = false, lastY = scrollY;
  addEventListener('scroll', () => { updateBack(); lastY = scrollY; }, { passive: true });

  function receive(msg) {
    if (!msg || typeof msg.sec !== 'string' || typeof msg.ts !== 'number' || msg.ts <= hereTs) return;
    verify(msg).then(ok => {
      if (!ok || msg.ts <= hereTs) return;
      hereTs = msg.ts; here = msg.sec; paintHere();
      if (!teach && follow) { autoScrolling = true; jump(); setTimeout(() => autoScrolling = false, 900); }
    });
  }

  /* ---------- 서명 (강사만 위치를 바꿀 수 있게) ---------- */
  const b64u = { enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
                 dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0)) };
  const ALG = { name: 'ECDSA', namedCurve: 'P-256' }, SIG = { name: 'ECDSA', hash: 'SHA-256' };
  let pubKey = null, privKey = null;
  const parseKey = (v) => { v = String(v || '').trim(); const m = v.match(/teach\.([A-Za-z0-9_-]{40,})/); if (m) return m[1]; return /^[A-Za-z0-9_-]{40,}$/.test(v) ? v : ''; };
  async function importPriv(d) {   // 열쇠를 불러오고, 공개 열쇠와 짝이 맞는지 서명해 확인
    if (!d || !crypto.subtle) return null;
    try {
      const k = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: CFG.publicKey.x, y: CFG.publicKey.y, d }, ALG, false, ['sign']);
      const t = new TextEncoder().encode('check'); const sg = await crypto.subtle.sign(SIG, k, t);
      if (pubKey && !(await crypto.subtle.verify(SIG, pubKey, sg, t))) return null;
      return k;
    } catch (e) { return null; }
  }
  const ready = (async () => {
    if (CFG.publicKey && crypto.subtle) pubKey = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: CFG.publicKey.x, y: CFG.publicKey.y }, ALG, false, ['verify']).catch(() => null);
    if (teach && CFG.publicKey) {
      for (const cand of [parseKey(location.hash), parseKey(store.get('teachKey'))]) {
        const k = await importPriv(cand); if (k) { privKey = k; store.set('teachKey', cand); break; }
      }
    }
  })();
  async function signStr(str) { await ready; if (!privKey) return null; return b64u.enc(await crypto.subtle.sign(SIG, privKey, new TextEncoder().encode(str))); }
  async function verifyStr(str, sig) { await ready; if (!CFG.publicKey) return true; if (!pubKey || !sig) return false; try { return await crypto.subtle.verify(SIG, pubKey, b64u.dec(sig), new TextEncoder().encode(str)); } catch (e) { return false; } }
  async function sign(msg) { await ready; if (!privKey) return msg; const s = await crypto.subtle.sign(SIG, privKey, new TextEncoder().encode(msg.sec + '|' + msg.ts)); return { ...msg, sig: b64u.enc(s) }; }
  async function verify(msg) {
    await ready; if (!CFG.publicKey) return true; if (!pubKey || !msg.sig) return false;
    try { return await crypto.subtle.verify(SIG, pubKey, b64u.dec(msg.sig), new TextEncoder().encode(msg.sec + '|' + msg.ts)); } catch (e) { return false; }
  }

  /* ---------- 연결: 같은 브라우저(시험용) + 실시간 서버(Supabase) ---------- */
  const peers = new Map(); // id -> {role, help, seen}
  const transports = [];
  function setStatus(on, text) { $('status').dataset.s = on ? 'on' : 'off'; $('statusText').textContent = text; }
  let stats = { n: 0, f: 0, h: 0, at: {} }, teacherOn = false;
  function refreshCounts() {
    const now = Date.now(); let n = 0, f = 0, h = 0; const at = {}; teacherOn = false;
    for (const [id, p] of peers) {
      if (p.local && now - p.seen > 12000) { peers.delete(id); continue; }
      if (p.role === 't') { teacherOn = true; continue; }
      if (p.role === 's') { n++; if (p.follow) f++; if (p.help) h++; if (p.at) at[p.at] = (at[p.at] || 0) + 1; }
    }
    if (!teach) { n++; if (follow) f++; if (helpOn) h++; }   // 나 자신도 셈
    stats = { n, f, h, at };
    $('countPill').textContent = '접속 ' + n + '명';
    $('followPill').textContent = '따라오는 중 ' + f + '명';
    $('helpPill').textContent = '막혔어요 ' + h + '명'; $('helpPill').classList.toggle('warn', h > 0);
    const c = $('crowd'); c.hidden = !(transports.length && (n > 1 || teacherOn));
    c.innerHTML = '함께 <b>' + n + '</b> · 따라오는 <b>' + f + '</b>';
    if (teach) document.querySelectorAll('#tocList a').forEach(a => { let b = a.querySelector('.cnt'); const k = at[a.dataset.id] || 0;
      if (!k) { if (b) b.remove(); return; } if (!b) { b = document.createElement('span'); b.className = 'cnt'; a.prepend(b); } b.textContent = k; });
  }
  setInterval(refreshCounts, 3000);

  // 1) 같은 브라우저의 다른 탭 (강의 전 혼자 시험해 보는 용도)
  if ('BroadcastChannel' in window) {
    const bc = new BroadcastChannel('gyoan-' + (CFG.room || 'demo'));
    bc.onmessage = (e) => { const d = e.data || {};
      if (d.type === 'here') receive(d.msg);
      if (d.type === 'show') showStats(d.msg);
      if (d.type === 'hello') { peers.set(d.id, { role: d.role, help: !!d.help, follow: !!d.follow, at: d.at, seen: Date.now(), local: true }); refreshCounts(); if (teach && here) sendHere();
        if (!sbCh) setStatus(true, teach ? '다른 탭과 연결됨(시험)' : '강사 탭과 연결됨(시험)'); }
    };
    const hello = () => bc.postMessage({ type: 'hello', id: myId, role: teach ? 't' : 's', help: helpOn, follow, at: myAt });
    hello(); setInterval(hello, 5000);
    transports.push({ here: (msg) => bc.postMessage({ type: 'here', msg }), show: (msg) => bc.postMessage({ type: 'show', msg }), presence: hello });
  }

  // 2) 실시간 서버 — config에 Supabase 주소가 있을 때만. 끊기면 스스로 다시 연결합니다(휴대폰은 화면을 끄거나 앱을 바꾸면 자주 끊김).
  let sbCh = null, sb = null, sbJoined = false, retry = 0, retryTimer = null, downTimer = null;
  const ROOM = 'gyoan-' + (CFG.room || 'class');
  function onPresence() {
    if (!sbCh) return; const st = sbCh.presenceState();
    for (const k of [...peers.keys()]) if (!peers.get(k).local) peers.delete(k);
    for (const [k, arr] of Object.entries(st)) { const p = arr[0] || {}; if (k === myId) continue; peers.set(k, { role: p.role, help: !!p.help, follow: !!p.follow, at: typeof p.at === 'string' ? p.at : null, seen: Date.now() }); if (p.role === 't' && p.here) receive(p.here); }
    refreshCounts();
    if (!teach && sbJoined) { const t = Object.values(st).some(arr => (arr[0] || {}).role === 't'); setStatus(true, t ? '강사와 연결됨' : '연결됨 · 강사 대기 중'); }
  }
  function scheduleReconnect() {
    sbJoined = false; clearTimeout(retryTimer);
    clearTimeout(downTimer); downTimer = setTimeout(() => { if (!sbJoined) setStatus(false, '다시 연결하는 중…'); }, 2500);  // 잠깐 끊김은 표시하지 않음
    const wait = [1000, 2000, 4000, 8000, 15000][Math.min(retry++, 4)];
    retryTimer = setTimeout(connect, wait);
  }
  function connect() {
    clearTimeout(retryTimer); retryTimer = null;
    try {
      if (!sb) sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { realtime: { heartbeatIntervalMs: 15000 } });
      if (sbCh) { const old = sbCh; sbCh = null; sb.removeChannel(old).catch(() => {}); }
      const ch = sb.channel(ROOM, { config: { broadcast: { self: false }, presence: { key: myId } } });
      sbCh = ch;
      ch.on('broadcast', { event: 'here' }, ({ payload }) => receive(payload));
      ch.on('broadcast', { event: 'show' }, ({ payload }) => showStats(payload));
      ch.on('presence', { event: 'sync' }, onPresence);
      ch.subscribe(async (state) => {
        if (ch !== sbCh) return;   // 이미 새 연결로 바뀐 옛 연결
        if (state === 'SUBSCRIBED') {
          sbJoined = true; retry = 0; clearTimeout(downTimer);
          setStatus(true, teach ? '실시간 연결됨' : '연결됨 · 강사 대기 중');
          await trackMe(); onPresence();
          if (teach && lastSigned) sendHere();
        } else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT' || state === 'CLOSED') {
          scheduleReconnect();
        }
      });
    } catch (e) { scheduleReconnect(); }
  }
  if (CFG.supabaseUrl && CFG.supabaseKey && window.supabase) {
    connect();
    // 화면으로 돌아오거나 인터넷이 다시 잡히면 바로 확인
    const wake = () => { if (!sbJoined) { retry = 0; connect(); } };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
    addEventListener('online', wake); addEventListener('pageshow', wake);
    // 5초마다 실제 연결 상태를 확인 — 끊김 알림이 오지 않는 경우도 다시 연결
    setInterval(() => {
      let ok = false; try { ok = sb.realtime.isConnected() && sbCh && sbCh.state === 'joined'; } catch (e) {}
      if (!ok && sbJoined) scheduleReconnect();
      else if (!ok && !retryTimer) scheduleReconnect();
    }, 5000);
    window.__gyoanTest = { drop: () => { try { sb.realtime.disconnect(); } catch (e) {} }, state: () => ({ joined: sbJoined, conn: sb.realtime.isConnected(), ch: sbCh && sbCh.state }) };  // 연결 끊김 시험용
    transports.push({
      here: (msg) => { if (sbCh && sbJoined) sbCh.send({ type: 'broadcast', event: 'here', payload: msg }).catch(() => {}); },
      show: (msg) => { if (sbCh && sbJoined) sbCh.send({ type: 'broadcast', event: 'show', payload: msg }).catch(() => {}); },
      presence: () => trackMe()
    });
  }
  let lastSigned = null;
  let trackTimer = null;
  async function trackMe() { if (!sbCh || !sbJoined) return; await sbCh.track(teach ? { role: 't', here: lastSigned } : { role: 's', help: helpOn, follow, at: myAt }).catch(() => {}); }

  if (!sbCh) {
    setStatus(false, CFG.supabaseUrl ? '연결 안 됨 · 혼자 보기' : '혼자 보기');
    const note = $('demoNote');
    note.hidden = false;
    note.textContent = teach
      ? '강사 모드 미리보기입니다. 같은 브라우저에서 이 교안을 다른 탭으로 하나 더 열면 그 탭이 수강생 화면이 되어 따라 움직입니다. 수강생 휴대폰과 연결하려면 실시간 서버 설정이 필요합니다.'
      : '미리보기입니다. 같은 브라우저의 다른 탭에서 강사 모드를 열면 이 화면이 따라 움직입니다.';
    if (CFG.supabaseUrl) note.textContent = '실시간 서버에 연결하지 못했습니다. 와이파이를 확인하고 새로고침해 주세요. 교안은 그대로 볼 수 있습니다.';
  }

  /* ---------- 강사 조작 ---------- */
  async function sendHere() { const msg = lastSigned || await sign({ sec: here, ts: hereTs }); transports.forEach(t => t.here(msg)); }
  async function teachGo(id) {
    if (!teach || !byId[id]) return;
    await ready; if (CFG.publicKey && !privKey) { askKey(); return; }
    here = id; hereTs = Date.now(); lastSigned = await sign({ sec: here, ts: hereTs });
    paintHere(); byId[id].scrollIntoView({ behavior: 'smooth' });
    transports.forEach(t => { t.here(lastSigned); }); trackMe();
    store.set('teachHere', id);
  }
  const step = (d) => { const i = marks.findIndex(m => m.id === here); const n = marks[Math.min(marks.length - 1, Math.max(0, (i < 0 ? 0 : i + d)))]; if (n) teachGo(n.id); };
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
  if (teach) {
    document.addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; if (e.key === 'PageDown' || (e.key === 'ArrowRight' && e.altKey)) { e.preventDefault(); step(1); } if (e.key === 'PageUp' || (e.key === 'ArrowLeft' && e.altKey)) { e.preventDefault(); step(-1); } });
    const saved = store.get('teachHere'); setTimeout(() => teachGo(saved && byId[saved] ? saved : marks[0].id), 300);
    setInterval(() => { if (here) sendHere(); }, 15000);  // 늦게 들어온 수강생을 위해 주기적으로 다시 알림
  }

  /* ---------- 내가 보고 있는 장 (강사 목차에 장별 인원으로 표시) ---------- */
  let atTimer = null;
  function calcAt() { let cur = null; for (const m of marks) { if (m.getBoundingClientRect().top < innerHeight * 0.35) cur = m.id; else break; } return cur; }
  addEventListener('scroll', () => { if (teach) return; clearTimeout(atTimer); atTimer = setTimeout(() => { const a = calcAt(); if (a !== myAt) { myAt = a; transports.forEach(t => t.presence()); } }, 1200); }, { passive: true });
  myAt = calcAt();

  /* ---------- 📣 모두에게 보여주기 ---------- */
  let showTs = 0, showTimer = null;
  function showStats(msg) {
    if (!msg || typeof msg.n !== 'number' || typeof msg.f !== 'number' || typeof msg.ts !== 'number' || msg.ts <= showTs || Date.now() - msg.ts > 60000) return;
    verifyStr('show|' + msg.n + '|' + msg.f + '|' + msg.ts, msg.sig).then(ok => {
      if (!ok || msg.ts <= showTs) return; showTs = msg.ts;
      const n = Math.max(0, Math.min(999, msg.n | 0)), f = Math.max(0, Math.min(n, msg.f | 0));
      $('showN').textContent = n; $('showF').textContent = f; $('showBar').style.width = '0';
      $('showSub').textContent = n ? '따라오는 비율 ' + Math.round(f / n * 100) + '%' : '';
      $('show').hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => { $('showBar').style.width = (n ? f / n * 100 : 0) + '%'; }));
      clearTimeout(showTimer); showTimer = setTimeout(() => { $('show').hidden = true; }, 7000);
    });
  }
  $('show').onclick = () => { $('show').hidden = true; };
  $('showBtn').onclick = async () => {
    refreshCounts(); const ts = Date.now(); const msg = { n: stats.n, f: stats.f, ts };
    const sig = await signStr('show|' + msg.n + '|' + msg.f + '|' + ts); if (CFG.publicKey && !sig) return;
    if (sig) msg.sig = sig; showStats(msg); transports.forEach(t => t.show && t.show(msg));
  };

  /* ---------- 강사 열쇠 넣기 (주소에 열쇠가 빠졌을 때) ---------- */
  function askKey() { $('keyForm').hidden = false; $('keyMsg').textContent = '강사 열쇠를 넣어야 수강생 화면이 따라옵니다'; }
  $('keyForm').addEventListener('submit', async (e) => {
    e.preventDefault(); await ready;
    const d = parseKey($('keyIn').value); const k = await importPriv(d);
    if (!k) { $('keyMsg').textContent = d ? '열쇠가 맞지 않습니다. 강사링크.txt의 #teach. 뒤 글자 전체를 붙여 넣어 주세요' : '열쇠 형식이 아닙니다'; return; }
    privKey = k; store.set('teachKey', d); $('keyIn').value = ''; $('keyForm').hidden = true;
    teachGo(here && byId[here] ? here : marks[0].id);
  });
  if (teach) ready.then(() => { if (CFG.publicKey && !privKey) askKey(); });

  /* ---------- 막혔어요 ---------- */
  $('help').onclick = () => { helpOn = !helpOn; $('help').setAttribute('aria-pressed', String(helpOn)); $('help').textContent = helpOn ? '✋ 도움 요청 중 · 누르면 취소' : '✋ 막혔어요'; transports.forEach(t => t.presence()); };

  setFollow(follow); paintHere();
})();
</script>
